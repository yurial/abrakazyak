[versions]
agp = "9.5.0"
kotlin = "2.4.21"
kover = "0.9.11"
# Newest Compose BOM whose artifacts allow compileSdk 36 (1.12.x needs 37,
# and the android-37 platform is not published in the stable SDK channel yet).
composeBom = "2026.06.01"
activityCompose = "1.13.0"
kotlinxSerializationJson = "1.9.0"
kotlinxCoroutines = "1.10.2"
# Core library desugaring: the `nio` artifact, NOT the default one — the
# default desugar_jdk_libs (any 2.x) does not cover java.nio.file, which :core
# storage uses (crash "Start game" in v0.1.0; see DesugaringConformanceTest).
desugarJdkLibs = "2.1.5"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
android-tools-desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
android-tools-desugar-jdk-libs-configuration-nio = { module = "com.android.tools:desugar_jdk_libs_configuration_nio", version.ref = "desugarJdkLibs" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Extract release notes from the tag message
        run: git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" | sed '/./,$!d' > release-notes.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.txt
          files: app/build/outputs/apk/release/app-release.apk
